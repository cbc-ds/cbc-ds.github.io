  # --- Speakers ---
  speakers:
    - name: "Annette Bieniusa"
      company: "RPTU University of Kaiserslautern-Landau"
      link: "http://softech.informatik.uni-kl.de"
      bio: >
        Annette Bieniusa is leading the Software Technology Group at the
        University of Kaiserslautern. Her research interests include
        semantics of concurrent and distributed programming, with a
        focus on replication, synchronization, and programming
        language concepts such as Software Transactional Memory and
        Replicated Data Structures. Annette is involved in several
        national and international research projects, including the
        EU-H2020 Project “Lightkone: Lightweight computation for
        networks at the edge”.
      image: "annette.jpg"   # put in static/img/

    - name: "Wolfgang Ahrendt"
      company: "Chalmers University of Technology"
      link: "https://www.cse.chalmers.se/~ahrendt/"
      bio: >
        Wolfgang Ahrendt is Professor at Chalmers University of Technology, Gothenburg, Sweden,
        and received his Ph.D. in Computer Science from the University of
        Karlsruhe, Germany, in 2001. His contributions lie in deductive
        verification of software, runtime verification, and combinations of
        static verification with runtime verification and testing. Wolfgang
        Ahrendt is one of the people behind the software verification approach
        and system KeY. Recent application areas of his work include
        automotive software safety, smart contracts and, and AI assisted
        development of reliable software.
      image: "wolfgang.jpg"

    - name: "Yackoley Amoussou-Guenou"
      company: "Université Paris-Panthéon-Assas"
      link: ""
      bio: >
      image: "yackolley.jpg"

    - name: "Cosimo Laneve"
      company: "University of Bologna"
      link: "https://www.unibo.it/sitoweb/cosimo.laneve/"
      bio: >
      image: "cosimo.jpg"

